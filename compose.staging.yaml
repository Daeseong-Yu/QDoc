name: qdoc

services:
  web:
    image: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
    ports:
      - "${QDOC_WEB_BIND:-127.0.0.1}:${QDOC_WEB_PORT:-13000}:3000"
    command: ["pnpm", "start:web"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    image: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env.staging}
      QDOC_RELEASE_SHA: ${QDOC_RELEASE_SHA:-}
      QDOC_APP_IMAGE: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
      ALLOW_CONSOLE_OTP: ${ALLOW_CONSOLE_OTP:-false}
      ALLOW_FIXED_OTP: ${ALLOW_FIXED_OTP:-false}
      FIXED_OTP_EMAIL: ${FIXED_OTP_EMAIL:-}
      FIXED_OTP_CODE: ${FIXED_OTP_CODE:-}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      APP_URL: ${APP_URL:?Set APP_URL in .env.staging}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?Set EMAIL_PROVIDER in .env.staging}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.staging}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.staging}
      OTP_REQUEST_PAIR_LIMIT_PER_MINUTE: ${OTP_REQUEST_PAIR_LIMIT_PER_MINUTE:-1}
      OTP_REQUEST_EMAIL_LIMIT_PER_HOUR: ${OTP_REQUEST_EMAIL_LIMIT_PER_HOUR:-5}
      OTP_REQUEST_EMAIL_LIMIT_PER_DAY: ${OTP_REQUEST_EMAIL_LIMIT_PER_DAY:-20}
      OTP_REQUEST_IP_LIMIT_PER_MINUTE: ${OTP_REQUEST_IP_LIMIT_PER_MINUTE:-10}
      OTP_REQUEST_IP_LIMIT_PER_HOUR: ${OTP_REQUEST_IP_LIMIT_PER_HOUR:-100}
      OTP_VERIFY_PAIR_LIMIT_PER_MINUTE: ${OTP_VERIFY_PAIR_LIMIT_PER_MINUTE:-5}
      OTP_VERIFY_EMAIL_LIMIT_PER_HOUR: ${OTP_VERIFY_EMAIL_LIMIT_PER_HOUR:-30}
      OTP_VERIFY_IP_LIMIT_PER_HOUR: ${OTP_VERIFY_IP_LIMIT_PER_HOUR:-120}
      MAP_PROVIDER: ${MAP_PROVIDER:-}
      MAP_PROVIDER_ENABLED: ${MAP_PROVIDER_ENABLED:-false}
      MAP_MONTHLY_MAP_LOAD_LIMIT: ${MAP_MONTHLY_MAP_LOAD_LIMIT:-0}
      MAP_MONTHLY_PLACES_SEARCH_LIMIT: ${MAP_MONTHLY_PLACES_SEARCH_LIMIT:-0}
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      MAPBOX_SEARCH_TOKEN: ${MAPBOX_SEARCH_TOKEN:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_PLACES_SERVER_KEY: ${GOOGLE_PLACES_SERVER_KEY:-}
      MAP_USAGE_RATE_LIMIT_PER_MINUTE: ${MAP_USAGE_RATE_LIMIT_PER_MINUTE:-30}
      MAP_USAGE_RATE_LIMIT_PER_HOUR: ${MAP_USAGE_RATE_LIMIT_PER_HOUR:-300}
      MAP_SEARCH_RATE_LIMIT_PER_MINUTE: ${MAP_SEARCH_RATE_LIMIT_PER_MINUTE:-10}
      MAP_SEARCH_RATE_LIMIT_PER_HOUR: ${MAP_SEARCH_RATE_LIMIT_PER_HOUR:-100}
      MAP_SEARCH_CACHE_TTL_SECONDS: ${MAP_SEARCH_CACHE_TTL_SECONDS:-600}
      MAP_SETTINGS_ADMIN_EMAILS: ${MAP_SETTINGS_ADMIN_EMAILS:-}
    command: ["pnpm", "start:api"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env.staging}
      QDOC_RELEASE_SHA: ${QDOC_RELEASE_SHA:-}
      QDOC_APP_IMAGE: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
      ALLOW_CONSOLE_OTP: ${ALLOW_CONSOLE_OTP:-false}
      ALLOW_FIXED_OTP: ${ALLOW_FIXED_OTP:-false}
      APP_URL: ${APP_URL:?Set APP_URL in .env.staging}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?Set EMAIL_PROVIDER in .env.staging}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.staging}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.staging}
      QDOC_WEB_BIND: ${QDOC_WEB_BIND:-127.0.0.1}
      OTP_REQUEST_PAIR_LIMIT_PER_MINUTE: ${OTP_REQUEST_PAIR_LIMIT_PER_MINUTE:-1}
      OTP_REQUEST_EMAIL_LIMIT_PER_HOUR: ${OTP_REQUEST_EMAIL_LIMIT_PER_HOUR:-5}
      OTP_REQUEST_EMAIL_LIMIT_PER_DAY: ${OTP_REQUEST_EMAIL_LIMIT_PER_DAY:-20}
      OTP_REQUEST_IP_LIMIT_PER_MINUTE: ${OTP_REQUEST_IP_LIMIT_PER_MINUTE:-10}
      OTP_REQUEST_IP_LIMIT_PER_HOUR: ${OTP_REQUEST_IP_LIMIT_PER_HOUR:-100}
      OTP_VERIFY_PAIR_LIMIT_PER_MINUTE: ${OTP_VERIFY_PAIR_LIMIT_PER_MINUTE:-5}
      OTP_VERIFY_EMAIL_LIMIT_PER_HOUR: ${OTP_VERIFY_EMAIL_LIMIT_PER_HOUR:-30}
      OTP_VERIFY_IP_LIMIT_PER_HOUR: ${OTP_VERIFY_IP_LIMIT_PER_HOUR:-120}
      MAP_PROVIDER: ${MAP_PROVIDER:-}
      MAP_PROVIDER_ENABLED: ${MAP_PROVIDER_ENABLED:-false}
      MAP_MONTHLY_MAP_LOAD_LIMIT: ${MAP_MONTHLY_MAP_LOAD_LIMIT:-0}
      MAP_MONTHLY_PLACES_SEARCH_LIMIT: ${MAP_MONTHLY_PLACES_SEARCH_LIMIT:-0}
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      MAPBOX_SEARCH_TOKEN: ${MAPBOX_SEARCH_TOKEN:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_PLACES_SERVER_KEY: ${GOOGLE_PLACES_SERVER_KEY:-}
      MAP_USAGE_RATE_LIMIT_PER_MINUTE: ${MAP_USAGE_RATE_LIMIT_PER_MINUTE:-30}
      MAP_USAGE_RATE_LIMIT_PER_HOUR: ${MAP_USAGE_RATE_LIMIT_PER_HOUR:-300}
      MAP_SEARCH_RATE_LIMIT_PER_MINUTE: ${MAP_SEARCH_RATE_LIMIT_PER_MINUTE:-10}
      MAP_SEARCH_RATE_LIMIT_PER_HOUR: ${MAP_SEARCH_RATE_LIMIT_PER_HOUR:-100}
      MAP_SEARCH_CACHE_TTL_SECONDS: ${MAP_SEARCH_CACHE_TTL_SECONDS:-600}
      QDOC_ADMIN_DATA_EXPECT_SITE_IDS: ${QDOC_ADMIN_DATA_EXPECT_SITE_IDS:-}
      QDOC_ADMIN_DATA_EXPECT_STAFF_ADMIN_EMAILS: ${QDOC_ADMIN_DATA_EXPECT_STAFF_ADMIN_EMAILS:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_OUTBOX_BATCH_SIZE: ${WORKER_OUTBOX_BATCH_SIZE:-10}
      WORKER_OUTBOX_MAX_ATTEMPTS: ${WORKER_OUTBOX_MAX_ATTEMPTS:-5}
      WORKER_HEALTH_FILE: /tmp/qdoc-worker-health.json
    command: ["pnpm", "start:worker"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');const f=process.env.WORKER_HEALTH_FILE||'/tmp/qdoc-worker-health.json';const d=JSON.parse(fs.readFileSync(f,'utf8'));if(Date.now()-Date.parse(d.updatedAt)>30000)process.exit(1);\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    image: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env.staging}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
    command: ["pnpm", "db:migrate:deploy"]

  seed:
    image: ${QDOC_APP_IMAGE:?Set QDOC_APP_IMAGE in .env.staging or the shell}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env.staging}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      QDOC_SEED_STAFF_ADMIN_EMAILS: ${QDOC_SEED_STAFF_ADMIN_EMAILS:-}
    command: ["pnpm", "db:seed:staging"]

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.staging}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${QDOC_DB_SECRET:?Set QDOC_DB_SECRET in .env.staging}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
